services:
  f2b-monitor:
    build: .
    container_name: f2b-monitor
    restart: always
    network_mode: host
    volumes:
      - ./.env:/app/.env:ro
      - ${CONFIG_ENV_PATH:?CONFIG_ENV_PATH not set}:${CONFIG_ENV_PATH}:ro
      - ${LOG_PATH:-/var/log/fail2ban.log}:${LOG_PATH:-/var/log/fail2ban.log}:ro
      # Для самообновления
      - /opt/f2b_monitor:/project
      - /var/run/docker.sock:/var/run/docker.sock
